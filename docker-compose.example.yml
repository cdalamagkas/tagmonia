services:
  tagmony:
    #image: ghcr.io/cdalamagkas/tagmony:latest # or `build: .`
    build: .
    container_name: tagmony
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PUID=1000 # honoured from Phase 6; the image currently runs as 1000:1000
      - PGID=1000
      - TAGMONY_PUBLIC_URL=https://tagmony.home.example
      - TAGMONY_READ_ONLY=true # recommended for a first try on an existing library
    volumes:
      - /mnt/c/Users/Public/Music:/music:ro
      - tagmony-config:/config
volumes:
  tagmony-config:
