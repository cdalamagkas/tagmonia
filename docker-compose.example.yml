services:
  tagmonia:
    #image: ghcr.io/cdalamagkas/tagmonia:latest # or `build: .`
    build: .
    container_name: tagmonia
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PUID=1000 # honoured from Phase 6; the image currently runs as 1000:1000
      - PGID=1000
      - TAGMONIA_PUBLIC_URL=https://tagmonia.home.example
      # Optional: fingerprint identification. Get a free application key at https://acoustid.org/new-application
      #- TAGMONIA_ACOUSTID_KEY_FILE=/run/secrets/acoustid_key
      # Optional: tell Jellyfin to re-read the albums Tagmonia wrote (an API key from Dashboard -> API Keys).
      #- TAGMONIA_JELLYFIN_URL=https://jellyfin.home.example
      #- TAGMONIA_JELLYFIN_KEY_FILE=/run/secrets/jellyfin_key
      #- TAGMONIA_JELLYFIN_LIBRARY=Music
      - TAGMONIA_READ_ONLY=true # recommended for a first try on an existing library
    #secrets:
    #  - acoustid_key
    #  - jellyfin_key
    volumes:
      - /mnt/c/Users/Public/Music:/music:ro
      - tagmonia-config:/config
volumes:
  tagmonia-config:
#secrets:
#  acoustid_key:
#    file: ./acoustid_key.txt
#  jellyfin_key:
#    file: ./jellyfin_key.txt
