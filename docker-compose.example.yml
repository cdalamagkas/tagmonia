services:
  tagmonia:
    #image: ghcr.io/cdalamagkas/tagmonia:latest # or `build: .`
    build: .
    container_name: tagmonia
    restart: unless-stopped
    ports:
      - "8080:8080"
    # All settings, with defaults or example values; see "Configuration" in README.md.
    # Commented lines are optional. For a value with a _FILE variant, set one of the two.
    environment:
      # Basics
      - PUID=1000
      - PGID=1000
      - TAGMONIA_PUBLIC_URL=https://tagmonia.home.example # REQUIRED for single sign-on
      #- TAGMONIA_MUSIC_DIR=/music
      #- TAGMONIA_CONFIG_DIR=/config
      #- TAGMONIA_INBOX_DIR=/inbox
      #- TAGMONIA_PORT=8080
      #- TAGMONIA_LOG_LEVEL=info

      # Admin account and stored secrets
      #- TAGMONIA_ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      #- TAGMONIA_SECRET_KEY=change-me-to-a-random-string-of-32-or-more-characters

      # AcoustID
      #- TAGMONIA_ACOUSTID_KEY=your-acoustid-application-key
      #- TAGMONIA_ACOUSTID_KEY_FILE=/run/secrets/acoustid_key

      # Jellyfin
      #- TAGMONIA_JELLYFIN_URL=https://jellyfin.home.example # REQUIRED for Jellyfin
      #- TAGMONIA_JELLYFIN_KEY=your-jellyfin-api-key # REQUIRED for Jellyfin
      #- TAGMONIA_JELLYFIN_KEY_FILE=/run/secrets/jellyfin_key
      #- TAGMONIA_JELLYFIN_LIBRARY=Music

      # Single sign-on (OpenID Connect)
      #- TAGMONIA_OIDC_ISSUER=https://auth.home.example/application/o/tagmonia/ # REQUIRED for single sign-on
      #- TAGMONIA_OIDC_CLIENT_ID=tagmonia # REQUIRED for single sign-on
      #- TAGMONIA_OIDC_CLIENT_SECRET=your-client-secret # REQUIRED for single sign-on
      #- TAGMONIA_OIDC_CLIENT_SECRET_FILE=/run/secrets/oidc_secret
      #- TAGMONIA_OIDC_GROUP=tagmonia # REQUIRED for single sign-on
      #- TAGMONIA_OIDC_GROUPS_CLAIM=groups
      #- TAGMONIA_OIDC_SCOPES=openid profile email groups
      #- TAGMONIA_OIDC_NAME=Authentik

      # Sign-in by a reverse proxy
      #- TAGMONIA_TRUSTED_HEADER=Remote-User # REQUIRED for proxy sign-in
      #- TAGMONIA_TRUSTED_GROUPS_HEADER=Remote-Groups
      #- TAGMONIA_TRUSTED_GROUP=tagmonia # REQUIRED for proxy sign-in
      #- TAGMONIA_TRUSTED_PROXIES=172.18.0.0/16 # REQUIRED for proxy sign-in

      # Recommended for a first try on an existing library
      - TAGMONIA_READ_ONLY=true
    #secrets:
    #  - admin_password
    #  - acoustid_key
    #  - jellyfin_key
    #  - oidc_secret
    volumes:
      - /path/to/music:/music:ro
      - tagmonia-config:/config
      #- /path/to/inbox:/inbox
volumes:
  tagmonia-config:
#secrets:
#  admin_password:
#    file: ./admin_password.txt
#  acoustid_key:
#    file: ./acoustid_key.txt
#  jellyfin_key:
#    file: ./jellyfin_key.txt
#  oidc_secret:
#    file: ./oidc_secret.txt
