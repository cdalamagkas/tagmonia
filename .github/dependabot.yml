# Update proposals as pull requests (ARCHITECTURE.md §14.6). Each goes through CI like any change.
version: 2
updates:
  # actions/checkout is pinned to a commit; Dependabot moves the commit and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # The Deno base image of the production and dev images, kept on the same version.
  - package-ecosystem: docker
    directories: ["/", "/docker"]
    schedule:
      interval: weekly
    commit-message:
      prefix: docker
    groups:
      deno-images:
        patterns: ["*"]
