name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Pinned to a commit (§14.6); v7 runs on Node 24 (Node 20 actions are deprecated on GitHub runners).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # Same toolchain image as local development (scripts/dk); nothing is installed on the runner.
      - name: Build dev image
        run: docker build -t tagmonia-dev:latest -f docker/dev.Dockerfile docker
      - name: Generate audio fixtures
        run: scripts/dk scripts/gen_fixtures.sh
      - name: Format check
        run: scripts/dk deno fmt --check
      - name: Lint
        run: scripts/dk deno task lint
      - name: Type check
        run: scripts/dk deno task check
      - name: Test
        run: scripts/dk deno task test
      - name: Build SPA
        run: scripts/dk sh -c "deno task web:install && deno run -A npm:vite@7.3.7 build web"

  image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      # Pinned to a commit (§14.6); v7 runs on Node 24 (Node 20 actions are deprecated on GitHub runners).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # Both platforms are built and checked on every change; nothing is published here (release.yml does, D73).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tagmonia:ci-amd64
      - name: Build (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: tagmonia:ci-arm64
      - name: Check (amd64)
        run: scripts/ci/check_image.sh tagmonia:ci-amd64 linux/amd64
      - name: Check (arm64)
        run: scripts/ci/check_image.sh tagmonia:ci-arm64 linux/arm64
